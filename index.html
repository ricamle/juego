<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ruta 78 — carreras retro de 8 bits</title>
<style>
  :root { --wood1:#5a3a1e; --wood2:#3f2812; --metal:#1a1a1a; --amber:#f2b134; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0c0c0c; color:#ddd;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%; padding:12px; gap:12px;
    -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  .console { background: repeating-linear-gradient(90deg, var(--wood1) 0 6px, var(--wood2) 6px 9px, var(--wood1) 9px 17px);
    padding:14px; border-radius:10px; box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 2px #00000055; }
  .bezel { background:var(--metal); padding:10px; border-radius:6px; position:relative; }
  canvas { display:block; image-rendering: pixelated; image-rendering: crisp-edges; background:#000; }
  .bezel::after { content:""; position:absolute; inset:10px; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  .label { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:#e9d8b4; font-size:12px; letter-spacing:.18em; }
  .label b { color:var(--amber); }
  .help { font-size:12px; color:#9a9a9a; text-align:center; line-height:1.6; max-width:520px; }
  .help kbd { background:#222; border:1px solid #444; border-radius:3px; padding:0 5px; color:#ddd; }
  .pad { display:none; gap:10px; width:100%; max-width:520px; }
  .pad button { flex:1; height:64px; font:inherit; font-size:16px; font-weight:700; letter-spacing:.1em; color:#111;
    background:#d9d0bd; border:0; border-radius:8px; box-shadow:0 4px 0 #8c8371; touch-action:none; }
  .pad button.gas { background:var(--amber); box-shadow:0 4px 0 #9a6b10; }
  .pad button.brk { background:#c9533e; color:#fff; box-shadow:0 4px 0 #7a2b1e; }
  .pad button:active, .pad button.on { transform:translateY(3px); box-shadow:0 1px 0 #000; }
  .mute { background:none; border:1px solid #6b5a3e; color:#e9d8b4; font:inherit; font-size:11px; letter-spacing:.12em; padding:3px 8px; border-radius:4px; cursor:pointer; }
  @media (pointer: coarse) { .pad { display:flex; } .keys { display:none; } }
</style>
</head>
<body>
  <div class="console">
    <div class="bezel"><canvas id="screen" width="160" height="200" aria-label="Pantalla del juego Ruta 78"></canvas></div>
    <div class="label"><span><b>RUTA 78</b> · CARRERAS</span><button class="mute" id="mute" type="button">SONIDO: SÍ</button></div>
  </div>
  <div class="pad" id="pad">
    <button data-k="left" type="button">◀</button>
    <button data-k="brake" class="brk" type="button">FRENO</button>
    <button data-k="gas" class="gas" type="button">GAS</button>
    <button data-k="right" type="button">▶</button>
  </div>
  <p class="help keys">
    <kbd>↑</kbd> o <kbd>Espacio</kbd> acelerar · <kbd>↓</kbd> frenar · <kbd>←</kbd> <kbd>→</kbd> girar · <kbd>P</kbd> pausa · <kbd>M</kbd> sonido<br>
    Adelanta todos los autos que puedas en 60 segundos. Si te adelantan, pierdes un punto.
  </p>

<script>
// Ruta 78 — lógica del juego (pura, sin DOM). Se usa en el navegador y en las pruebas de Node.
(function (root) {
  'use strict';

  const C = {
    W: 160, H: 200, HUD: 16,
    ROAD_L: 32, ROAD_R: 128,
    LANES: [48, 80, 112],
    CAR_W: 12, CAR_H: 16,
    PLAYER_Y: 168,
    MAX_SPEED: 220, ACCEL: 90, BRAKE: 200, COAST: 35,
    STEER: 80,
    RACE_TIME: 60,
    CRASH_TIME: 1.0,
    RIVAL_MIN: 50, RIVAL_MAX: 140,
    SPAWN_BAND_TOP: -40, SPAWN_BAND_BOTTOM: 60,
  };

  // Generador pseudoaleatorio con semilla (mulberry32): partidas reproducibles.
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  // Colisión por cajas alineadas (AABB) con 2 px de tolerancia.
  function overlap(a, b) {
    return Math.abs(a.x - b.x) < C.CAR_W - 2 && Math.abs(a.y - b.y) < C.CAR_H - 2;
  }

  function createState(seed) {
    return {
      mode: 'title',
      seed: seed,
      rand: rng(seed),
      timeLeft: C.RACE_TIME,
      elapsed: 0,
      player: { x: C.LANES[1], y: C.PLAYER_Y, speed: 0, crash: 0 },
      rivals: [],
      passed: 0,
      distance: 0,
      spawnCd: 1.0,
      offset: 0,
      events: [],
      nextId: 1,
    };
  }

  function start(seed) {
    const s = createState(seed);
    s.mode = 'play';
    return s;
  }

  function spawnInterval(elapsed) {
    return Math.max(0.45, 1.3 - elapsed * 0.012);
  }

  function lanesBusy(s) {
    const busy = [false, false, false];
    for (const r of s.rivals) {
      if (r.y > C.SPAWN_BAND_TOP && r.y < C.SPAWN_BAND_BOTTOM) busy[r.lane] = true;
    }
    return busy;
  }

  // Crea un rival arriba, sin bloquear nunca los tres carriles a la vez.
  function spawn(s) {
    const busy = lanesBusy(s);
    const free = [0, 1, 2].filter(i => !busy[i]);
    if (free.length <= 1) return null;
    const lane = free[Math.floor(s.rand() * free.length)];
    const r = {
      id: s.nextId++,
      lane: lane,
      x: C.LANES[lane],
      y: -20,
      speed: C.RIVAL_MIN + s.rand() * (C.RIVAL_MAX - C.RIVAL_MIN),
      color: s.nextId % 4,
      hit: false,
    };
    s.rivals.push(r);
    return r;
  }

  function update(s, input, dt) {
    s.events = [];
    if (s.mode !== 'play') return s;
    dt = Math.min(dt, 0.05);
    const p = s.player;

    s.elapsed += dt;
    s.timeLeft = Math.max(0, s.timeLeft - dt);

    if (p.crash > 0) {
      p.crash = Math.max(0, p.crash - dt);
      p.speed = 0;
    } else {
      if (input.gas) p.speed += C.ACCEL * dt;
      else if (input.brake) p.speed -= C.BRAKE * dt;
      else p.speed -= C.COAST * dt;
      p.speed = clamp(p.speed, 0, C.MAX_SPEED);
      const steer = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      p.x = clamp(p.x + steer * C.STEER * dt, C.ROAD_L + C.CAR_W / 2, C.ROAD_R - C.CAR_W / 2);
    }

    s.distance += p.speed * dt;
    s.offset = (s.offset + p.speed * dt) % 32;

    for (const r of s.rivals) {
      const prevY = r.y;
      r.y += (p.speed - r.speed) * dt;
      if (p.crash === 0 && overlap(p, r)) {
        p.crash = C.CRASH_TIME;
        p.speed = 0;
        r.hit = true;
        s.events.push('crash');
        continue;
      }
      if (prevY < p.y && r.y >= p.y) { s.passed++; s.events.push('pass'); }
      else if (prevY >= p.y && r.y < p.y) { s.passed = Math.max(0, s.passed - 1); s.events.push('overtaken'); }
    }
    s.rivals = s.rivals.filter(r => !r.hit && r.y > -40 && r.y < C.H + 40);

    s.spawnCd -= dt * (p.speed / C.MAX_SPEED);
    if (s.spawnCd <= 0) {
      spawn(s);
      s.spawnCd = spawnInterval(s.elapsed);
    }

    if (s.timeLeft === 0) {
      s.mode = 'over';
      s.events.push('over');
    }
    return s;
  }

  const api = { C, rng, clamp, overlap, createState, start, update, spawn, spawnInterval, lanesBusy };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.RaceLogic = api;
})(this);

</script>
<script>
(function () {
  'use strict';
  const G = window.RaceLogic, C = G.C;
  const cv = document.getElementById('screen');
  const ctx = cv.getContext('2d');

  // ---------- Escalado entero de la pantalla ----------
  function fit() {
    const maxW = Math.min(window.innerWidth - 60, 640);
    const maxH = window.innerHeight - (matchMedia('(pointer: coarse)').matches ? 190 : 140);
    const k = Math.max(1, Math.floor(Math.min(maxW / C.W, maxH / C.H)));
    cv.style.width = C.W * k + 'px';
    cv.style.height = C.H * k + 'px';
  }
  window.addEventListener('resize', fit); fit();

  // ---------- Fuente de píxeles 3x5 ----------
  const FONT = {
    A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
    F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
    K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
    P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
    U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
    Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
    '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
    '9':'111101111001110',':':'000010000010000','.':'000000000000010','-':'000000111000000','!':'010010010000010','+':'000010111010000',' ':'000000000000000'
  };
  function textW(str, k) { return str.length * 4 * k - k; }
  function text(str, x, y, color, k = 1) {
    ctx.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]] || FONT[' '];
      for (let j = 0; j < 15; j++) if (g[j] === '1') ctx.fillRect(x + (i * 4 + (j % 3)) * k, y + Math.floor(j / 3) * k, k, k);
    }
  }
  function ctext(str, y, color, k = 1) { text(str, Math.round((C.W - textW(str, k)) / 2), y, color, k); }
  const pad = (n, w) => String(n).padStart(w, '0');

  // ---------- Sprites ----------
  const CAR = [
    '..tt....tt..',
    '..tbbbbbbt..',
    '...bbbbbb...',
    '...bwwwwb...',
    '...bwwwwb...',
    '..bbbbbbbb..',
    '.tbbhhhhbbt.',
    '.tbbhhhhbbt.',
    '..bbbbbbbb..',
    '...bbbbbb...',
    '...bwwwwb...',
    '..bbbbbbbb..',
    '.tbbbbbbbbt.',
    '.tbbbbbbbbt.',
    '..bbbbbbbb..',
    '...ll..ll...'
  ];
  const RIVAL_COLORS = [['#3b6fd8','#8fb0f0'], ['#e3c42b','#fff1a0'], ['#2bb8b0','#9ef0ea'], ['#b04bd0','#e3a6f5']];
  function car(cx, cy, body, hi, lights) {
    const x0 = Math.round(cx - 6), y0 = Math.round(cy - 8);
    for (let r = 0; r < 16; r++) for (let c = 0; c < 12; c++) {
      const ch = CAR[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = ch === 'b' ? body : ch === 'h' ? hi : ch === 'w' ? '#1b1b2a' : ch === 't' ? '#111' : lights;
      ctx.fillRect(x0 + c, y0 + r, 1, 1);
    }
  }

  // ---------- Escenario ----------
  function scene(s) {
    const off = s.offset;
    for (let y = C.HUD; y < C.H; y++) {
      const band = ((y - off) % 32 + 32) % 32 < 16;
      ctx.fillStyle = band ? '#2f7d32' : '#3b9140';
      ctx.fillRect(0, y, C.W, 1);
      ctx.fillStyle = (((y - off) % 16 + 16) % 16) < 8 ? '#d8d8d8' : '#c8352b';
      ctx.fillRect(C.ROAD_L - 4, y, 4, 1);
      ctx.fillRect(C.ROAD_R, y, 4, 1);
    }
    ctx.fillStyle = '#5b5b5f';
    ctx.fillRect(C.ROAD_L, C.HUD, C.ROAD_R - C.ROAD_L, C.H - C.HUD);
    ctx.fillStyle = '#e6d36a';
    for (let y = C.HUD - 16 + (off % 16); y < C.H; y += 16) {
      ctx.fillRect(63, Math.max(C.HUD, y), 2, Math.max(0, Math.min(8, y + 8 - Math.max(C.HUD, y))));
      ctx.fillRect(95, Math.max(C.HUD, y), 2, Math.max(0, Math.min(8, y + 8 - Math.max(C.HUD, y))));
    }
    // arbustos laterales
    for (let y = C.HUD - 48 + (off * 1.5 % 48); y < C.H; y += 48) {
      if (y < C.HUD) continue;
      ctx.fillStyle = '#1d5a22'; ctx.fillRect(8, y, 10, 8); ctx.fillRect(142, y + 20, 10, 8);
      ctx.fillStyle = '#4fae55'; ctx.fillRect(10, y + 1, 4, 3); ctx.fillRect(144, y + 21, 4, 3);
    }
  }

  function hud(s, best) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, C.W, C.HUD);
    text('PTS ' + pad(s.passed, 3), 4, 2, '#f2b134');
    text('T ' + pad(Math.ceil(s.timeLeft), 2), 64, 2, s.timeLeft <= 10 ? '#ff5544' : '#e9e9e9');
    text('KM ' + (s.distance / 1000).toFixed(1), 104, 2, '#e9e9e9');
    // velocímetro
    ctx.fillStyle = '#222'; ctx.fillRect(4, 10, 152, 3);
    ctx.fillStyle = s.player.crash > 0 ? '#ff5544' : '#4fae55';
    ctx.fillRect(4, 10, Math.round(152 * s.player.speed / C.MAX_SPEED), 3);
  }

  // ---------- Sonido (Web Audio, onda cuadrada) ----------
  let actx = null, osc = null, gain = null, muted = false;
  try { muted = localStorage.getItem('ruta78-mute') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('mute');
  function paintMute() { muteBtn.textContent = 'SONIDO: ' + (muted ? 'NO' : 'SÍ'); }
  paintMute();
  function audioOn() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      osc = actx.createOscillator(); gain = actx.createGain();
      osc.type = 'square'; osc.frequency.value = 55; gain.gain.value = 0;
      osc.connect(gain).connect(actx.destination); osc.start();
    } catch (e) { actx = null; }
  }
  function beep(freq, dur, type = 'square', vol = 0.05) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }
  function crashSound() {
    if (!actx || muted) return;
    const len = actx.sampleRate * 0.5, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = actx.createBufferSource(), g = actx.createGain(); g.gain.value = 0.12;
    src.buffer = buf; src.connect(g).connect(actx.destination); src.start();
  }
  function engine(s) {
    if (!actx) return;
    const on = s.mode === 'play' && !paused && !muted;
    gain.gain.setTargetAtTime(on ? 0.025 : 0, actx.currentTime, 0.05);
    osc.frequency.setTargetAtTime(45 + s.player.speed * 0.55, actx.currentTime, 0.05);
  }
  function toggleMute() {
    muted = !muted; paintMute();
    try { localStorage.setItem('ruta78-mute', muted ? '1' : '0'); } catch (e) {}
  }
  muteBtn.addEventListener('click', () => { audioOn(); toggleMute(); muteBtn.blur(); });

  // ---------- Entrada ----------
  const input = { gas: false, brake: false, left: false, right: false };
  const KEYMAP = { ArrowUp:'gas', KeyW:'gas', Space:'gas', ArrowDown:'brake', KeyS:'brake', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
  let paused = false;
  window.addEventListener('keydown', e => {
    audioOn();
    if (KEYMAP[e.code]) { input[KEYMAP[e.code]] = true; e.preventDefault(); }
    if ((e.code === 'Space' || e.code === 'Enter') && state.mode !== 'play' && !e.repeat) begin();
    if (e.code === 'KeyP' && state.mode === 'play') paused = !paused;
    if (e.code === 'KeyM') toggleMute();
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.code]) input[KEYMAP[e.code]] = false; });
  window.addEventListener('blur', () => { for (const k in input) input[k] = false; if (state.mode === 'play') paused = true; });
  document.querySelectorAll('#pad button').forEach(b => {
    const k = b.dataset.k;
    const down = e => { e.preventDefault(); audioOn(); input[k] = true; b.classList.add('on'); if (state.mode !== 'play' && (k === 'gas')) begin(); };
    const up = e => { e.preventDefault(); input[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  });
  cv.addEventListener('pointerdown', () => { audioOn(); if (state.mode !== 'play') begin(); else paused = false; });

  // ---------- Récord ----------
  let best = 0;
  try { best = parseInt(localStorage.getItem('ruta78-best') || '0', 10) || 0; } catch (e) {}
  function saveBest(v) { best = v; try { localStorage.setItem('ruta78-best', String(v)); } catch (e) {} }

  // ---------- Bucle principal ----------
  let state = G.createState(Date.now() & 0xffffffff);
  let newRecord = false, blink = 0, overAt = 0;
  function begin() {
    if (state.mode === 'over' && performance.now() - overAt < 800) return;
    state = G.start((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    paused = false; newRecord = false;
    beep(440, 0.08); setTimeout(() => beep(660, 0.12), 90);
  }

  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000; last = now; blink += dt;
    if (state.mode === 'play' && !paused) {
      G.update(state, input, dt);
      for (const ev of state.events) {
        if (ev === 'pass') beep(880, 0.06, 'square', 0.04);
        else if (ev === 'overtaken') beep(160, 0.15, 'triangle', 0.06);
        else if (ev === 'crash') crashSound();
        else if (ev === 'over') {
          overAt = performance.now();
          if (state.passed > best) { saveBest(state.passed); newRecord = true; }
          beep(330, 0.2); setTimeout(() => beep(220, 0.35), 220);
        }
      }
    }
    engine(state);
    draw();
    requestAnimationFrame(frame);
  }

  function draw() {
    const s = state;
    scene(s);
    for (const r of s.rivals) { const c = RIVAL_COLORS[r.color]; car(r.x, r.y, c[0], c[1], '#ffffff'); }
    const p = s.player;
    if (!(p.crash > 0 && Math.floor(blink * 12) % 2)) car(p.x, p.y, '#d23a2c', '#ff8a70', '#ffe27a');
    if (p.crash > 0) {
      ctx.fillStyle = '#ffd23a';
      for (let i = 0; i < 6; i++) ctx.fillRect(p.x - 10 + ((i * 37 + Math.floor(blink * 30)) % 20), p.y - 14 + ((i * 53) % 8), 2, 2);
    }
    hud(s, best);

    if (s.mode === 'title') {
      veil();
      ctext('RUTA 78', 54, '#f2b134', 3);
      ctext('CARRERA DE 60 SEGUNDOS', 84, '#e9e9e9');
      ctext('ADELANTA AUTOS: +1', 96, '#e9e9e9');
      ctext('TE ADELANTAN: -1', 104, '#e9e9e9');
      ctext('RECORD ' + pad(best, 3), 124, '#4fae55');
      if (Math.floor(blink * 2) % 2 === 0) ctext('PULSA ESPACIO', 146, '#ffffff');
    } else if (s.mode === 'over') {
      veil();
      ctext('FIN DEL JUEGO', 60, '#ff5544', 2);
      ctext('AUTOS ADELANTADOS', 90, '#e9e9e9');
      ctext(pad(s.passed, 3), 100, '#f2b134', 3);
      ctext(newRecord ? 'NUEVO RECORD!' : 'RECORD ' + pad(best, 3), 126, newRecord ? '#4fae55' : '#e9e9e9');
      if (Math.floor(blink * 2) % 2 === 0) ctext('PULSA ESPACIO', 146, '#ffffff');
    } else if (paused) {
      veil();
      ctext('PAUSA', 92, '#f2b134', 2);
    }
  }
  function veil() { ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, C.HUD, C.W, C.H - C.HUD); }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
